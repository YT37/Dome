<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#010102">
<title>Dome · Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<link rel="stylesheet" href="/static/globe.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 24a12 12 0 0 1 24 0' fill='none' stroke='%23828fff' stroke-width='3'/%3E%3Ccircle cx='16' cy='22' r='3' fill='%23ef5f5f'/%3E%3C/svg%3E">
</head>
<body>
<div class="banner" role="note">
  <b>Synthetic case.</b> Real buildings are used only as demo locations; no real activity is implied. Public data only.
</div>

<div id="map" aria-label="Globe"></div>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><path d="M6 29a14 14 0 0 1 28 0" fill="none" stroke="#828fff" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="27" r="3.2" fill="#ef5f5f"/></svg>
    <div><b>Dome</b><span id="caseLabel">case</span></div>
  </div>
  <div class="actions">
    <select id="caseSel" class="ctl" aria-label="Case"></select>
    <button class="btn" id="replayBtn" type="button" title="Replay with fixed timing (R)">Replay</button>
    <button class="btn" id="presentBtn" type="button" title="Presenter mode (P)">Presenter</button>
    <a class="btn ghost" href="/" title="The classic case console">Classic console</a>
  </div>
</header>

<ol class="steps" id="steps" aria-label="Flight steps"></ol>

<aside class="card" id="card" aria-live="polite"></aside>

<nav class="dock" aria-label="Panels">
  <button type="button" data-panel="graph">Link chart</button>
  <button type="button" data-panel="spotter" hidden>Spotter queue</button>
  <button type="button" data-panel="topology" hidden>Topology</button>
  <button type="button" data-panel="money" hidden>Money</button>
  <span class="keys"><kbd>←</kbd><kbd>→</kbd> step · <kbd>P</kbd> presenter · <kbd>R</kbd> replay</span>
</nav>

<div class="ticker" id="ticker" aria-live="polite"></div>

<section class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button class="btn ghost" id="sheetClose" type="button">Close</button></header>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<section class="inside" id="inside" hidden>
  <div class="pano-wrap"><div id="pano"></div><div class="pano-tag" id="panoTag"></div></div>
  <div class="inside-side">
    <figure class="match">
      <figcaption>Ad photo (left) · matched scan view (right)</figcaption>
      <img id="matchImg" alt="Ring ad photo beside the matched scan view">
      <div class="thumbs" id="matchThumbs"></div>
    </figure>
    <figure class="plan">
      <figcaption id="planCap">Floor plan · matched sweep</figcaption>
      <div class="plan-box"><img id="planImg" alt="Floor plan of the matched unit"></div>
    </figure>
    <p class="fine">Lead for human verification. A matching room is not evidence that anyone is present.</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script src="/static/globe.js"></script>
</body>
</html>
