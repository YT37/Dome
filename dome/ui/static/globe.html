<!doctype html>
<html lang="en">
<head>
<script src="/env.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#010102">
<title>Dome · Globe</title>
<link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
<link rel="stylesheet" href="/static/vendor/maplibre-gl/maplibre-gl.css">
<link rel="stylesheet" href="/static/vendor/pannellum/pannellum.css">
<link rel="stylesheet" href="/static/globe.css">
<link rel="icon" href="/static/logo-mark.svg" type="image/svg+xml">
</head>
<body>

<div id="map" aria-label="Globe"></div>

<header class="top">
  <div class="brand">
    <img src="/static/logo-mark.svg" width="38" height="32" alt="Dome">
    <nav class="apptabs" aria-label="Pages"><a href="/" id="homeTab">Homepage</a><a href="/globe" class="on" aria-current="page">Globe</a></nav>
    <span class="casename" id="caseLabel">case</span>
  </div>
  <div class="actions">
    <select id="caseSel" class="ctl" aria-label="Case" hidden></select>
    <button class="btn" id="replayBtn" type="button" title="Replay with fixed timing (R)">Replay</button>
    <button class="btn" id="presentBtn" type="button" title="Presenter mode (P)">Presenter</button>
  </div>
</header>

<ol class="steps" id="steps" aria-label="Flight steps"></ol>

<aside class="card" id="card" aria-live="polite"></aside>

<nav class="dock" aria-label="Panels">
  <button type="button" data-panel="graph">Link chart</button>
  <button type="button" data-panel="steps" hidden>Show the work</button>
  <span class="keys"><kbd>←</kbd><kbd>→</kbd> step · <kbd>P</kbd> presenter · <kbd>R</kbd> replay</span>
</nav>

<div class="ticker" id="ticker" aria-live="polite" hidden></div>

<section class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button class="btn ghost" id="sheetClose" type="button">Close</button></header>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<section class="drawer" id="drawer" hidden aria-label="Show the work">
  <header>
    <div><div class="eyebrow">Show the work</div><h2 id="drawerTitle"></h2></div>
    <div class="drawer-tabs" id="drawerTabs"></div>
    <button class="btn ghost" id="drawerClose" type="button">Close</button>
  </header>
  <div class="drawer-body">
    <h3 id="stepTitle"></h3>
    <div class="step-view" id="stepView"></div>
    <p class="step-cap" id="stepCap"></p>
    <p class="step-src">read from: <code id="stepSrc"></code></p>
  </div>
  <footer><button class="btn" id="stepPrev" type="button">← Prev</button><span id="stepCount"></span>
    <button class="btn primary" id="stepNext" type="button">Next →</button></footer>
</section>

<section class="inside" id="inside" hidden>
  <div class="pano-wrap"><div id="pano"></div><iframe id="mp" hidden allow="fullscreen; xr-spatial-tracking" referrerpolicy="no-referrer"></iframe>
    <div class="pano-tag" id="panoTag"></div></div>
  <div class="inside-side">
    <figure class="match">
      <figcaption>Ad photo (left) · matched scan view (right)</figcaption>
      <img id="matchImg" alt="Ring ad photo beside the matched scan view">
      <div class="thumbs" id="matchThumbs"></div>
    </figure>
    <figure class="plan">
      <figcaption id="planCap">Floor plan · matched sweep</figcaption>
      <div class="plan-box"><img id="planImg" alt="Floor plan of the matched unit"></div>
    </figure>
    <p class="fine">Lead for human verification. A matching room is not evidence that anyone is present.</p>
  </div>
</section>

<script src="/static/vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="/static/vendor/chartjs/chart.umd.min.js"></script>
<script src="/static/vendor/pannellum/pannellum.js"></script>
<script src="/static/vendor/cytoscape/cytoscape.min.js"></script>
<script src="/static/vendor/cytoscape-fcose/layout-base.js"></script>
<script src="/static/vendor/cytoscape-fcose/cose-base.js"></script>
<script src="/static/vendor/cytoscape-fcose/cytoscape-fcose.js"></script>
<script src="/static/globe.js"></script>
</body>
</html>
